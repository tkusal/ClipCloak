name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22.x, 24.x]
    
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    
    - name: Install pnpm
      uses: pnpm/action-setup@a3c52b85142dd0e2a3d78707c99732dd441b9ef2 # v3.0.0
      with:
        version: 9
        
    - name: Install Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@3963029e07ae253f41ee4761cc241858ce1b22e1 # v4.1.0
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'
        
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      
    - name: Build
      run: pnpm build
      
    - name: Lint
      run: pnpm lint
      
    - name: Test
      run: pnpm test
      
    - name: Smoke Test CLI
      run: node apps/cli/dist/index.js doctor
